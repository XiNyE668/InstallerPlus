name: kernel-v5-clang-export

on:
  push:
    branches: [ kernel-v5-build ]
    paths:
      - '.github/workflows/kernel-v5-clang-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch pinned Android clang
        run: |
          set -euxo pipefail
          git lfs install
          git clone --depth=1 https://github.com/nduykha/Clang_r563880c_13989888.git toolchain
          cd toolchain
          test "$(git rev-parse HEAD)" = "1163207ab5aa3669d9912e9e0898c4c60d16f6e3"
          ./bin/clang --version | tee ../clang-version.txt
          grep -q '^21.0.0' AndroidVersion.txt
          grep -q 'r563880c' AndroidVersion.txt
      - name: Package runtime toolchain
        run: |
          set -euxo pipefail
          rm -rf toolchain/.git
          tar --zstd -cf clang-r563880c.tar.zst toolchain clang-version.txt
          sha256sum clang-r563880c.tar.zst > clang-r563880c.tar.zst.sha256
          ls -lh clang-r563880c.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-v5-clang-r563880c-linux-x86_64
          retention-days: 7
          compression-level: 0
          path: |
            clang-r563880c.tar.zst
            clang-r563880c.tar.zst.sha256
            clang-version.txt
