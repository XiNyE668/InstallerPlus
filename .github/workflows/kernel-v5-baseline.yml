name: kernel-v5-baseline

on:
  push:
    branches: [ kernel-v5-build ]
    paths:
      - '.github/workflows/kernel-v5-baseline.yml'
      - 'kernel-v5/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential git git-lfs curl xz-utils libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fetch exact Lineage V4 base
        shell: bash
        run: |
          set -euxo pipefail
          mkdir kernel
          cd kernel
          git init
          git remote add origin https://github.com/LineageOS/android_kernel_xiaomi_sm8250.git
          git fetch --depth=1 origin 71b13e62f057a649b77fe4062feb73ee72ad609c
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "71b13e62f057a649b77fe4062feb73ee72ad609c"

      - name: Reconstruct V4 source state
        run: |
          cd kernel
          git apply ../kernel-v5/camera-v4.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('drivers/block/zram/zram_drv.c')
          s=p.read_text()
          old='static const char *default_compressor = "lzo";'
          new='static const char *default_compressor = "zstd";'
          assert old in s, 'V4 zram baseline string not found'
          p.write_text(s.replace(old,new,1))
          PY
          grep -n 'default_compressor' drivers/block/zram/zram_drv.c | head
          grep -R -n 'CAM_OIS_PACKET_OPCODE_TELEOIS_GETDATA' techpack/camera-xiaomi/drivers/cam_sensor_module | head

      - name: Fetch pinned clang r563880c mirror
        shell: bash
        run: |
          set -euxo pipefail
          git lfs install
          git clone --depth=1 https://github.com/nduykha/Clang_r563880c_13989888.git toolchain
          cd toolchain
          test "$(git rev-parse HEAD)" = "1163207ab5aa3669d9912e9e0898c4c60d16f6e3"
          ./bin/clang --version | tee "$GITHUB_WORKSPACE/clang-version.txt"
          grep -q '^21.0.0' AndroidVersion.txt
          grep -q 'r563880c' AndroidVersion.txt

      - name: Generate lmi config
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel
          mkdir -p out
          scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/vendor/kona-perf_defconfig \
            arch/arm64/configs/vendor/debugfs.config \
            arch/arm64/configs/vendor/xiaomi/sm8250-common.config \
            arch/arm64/configs/vendor/xiaomi/lmi.config
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig
          grep -E 'CONFIG_(KALLSYMS|KALLSYMS_ALL|KPROBES|ZRAM|CRYPTO_ZSTD|ZSTD_COMPRESS|LTO|MODVERSIONS)' out/.config || true

      - name: Build V4 baseline Image
        shell: bash
        run: |
          set -o pipefail
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image 2>&1 | tee "$GITHUB_WORKSPACE/build-v4-baseline.log"
          test -s out/arch/arm64/boot/Image
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/V4-baseline-Image"
          cp out/.config "$GITHUB_WORKSPACE/V4-baseline.config"
          sha256sum "$GITHUB_WORKSPACE/V4-baseline-Image" | tee "$GITHUB_WORKSPACE/V4-baseline.sha256"

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: V4-baseline-control
          if-no-files-found: error
          retention-days: 7
          path: |
            V4-baseline-Image
            V4-baseline.config
            V4-baseline.sha256
            clang-version.txt
            build-v4-baseline.log
