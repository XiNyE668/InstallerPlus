name: Build TeleVip 71122 V1

on:
  push:
    branches:
      - televip-71122-v1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch verified TeleVip checkpoint
        run: |
          git clone https://github.com/2B-4G10/TeleVIP.git TeleVip
          cd TeleVip
          git checkout be9a5824584ef6907eecfe739d7e9b7d07dad8f0

      - name: Mark Telegram 12.10.6 / 71122 and V1
        run: |
          cd TeleVip
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          s=s.replace('versionCode = 346', 'versionCode = 347')
          s=s.replace('versionName = "1.0.6"', 'versionName = "3.6.3-71122-V1"')
          p.write_text(s)

          p=Path("app/src/main/java/com/my/televip/ClientChecker.java")
          s=p.read_text()
          s=s.replace('VERIFIED_BUILD.put(ClientType.Telegram, "12.10.1 (70382)");',
                      'VERIFIED_BUILD.put(ClientType.Telegram, "12.10.6 (71122)");')
          p.write_text(s)
          PY
          grep -n "versionCode\|versionName" app/build.gradle
          grep -n 'ClientType.Telegram,' app/src/main/java/com/my/televip/ClientChecker.java

      - name: Build installable debug APK
        run: |
          cd TeleVip
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Stage artifact
        run: |
          mkdir -p out
          cp TeleVip/app/build/outputs/apk/debug/app-debug.apk out/TeleVip-71122-V1.apk
          sha256sum out/TeleVip-71122-V1.apk | tee out/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeleVip-71122-V1
          path: out/*
          if-no-files-found: error
