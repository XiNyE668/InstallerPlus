name: kernel-v5-llvm17-host-tools
on:
  push:
    branches: [kernel-v5-build]
    paths: ['.github/workflows/kernel-v5-llvm17-host-tools.yml']
jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - name: Install LLVM 17
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          if ! sudo apt-get install -y llvm-17; then
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 17
          fi
          LLVM_DIR=/usr/lib/llvm-17/bin
          test -x "$LLVM_DIR/llvm-nm"
          mkdir -p bundle/bin bundle/lib
          for t in llvm-nm llvm-readelf llvm-size llvm-strip; do
            test -x "$LLVM_DIR/$t"
            cp -L "$LLVM_DIR/$t" "bundle/bin/$t"
          done
          for exe in bundle/bin/*; do
            ldd "$exe" | awk '/=> \/|^\// {for(i=1;i<=NF;i++) if ($i ~ /^\//) print $i}'
          done | sort -u > /tmp/libs.txt
          while read -r lib; do cp -L "$lib" bundle/lib/; done < /tmp/libs.txt
          "$LLVM_DIR/llvm-nm" --version | head -2 | tee bundle/VERSION.txt
          sha256sum bundle/bin/* bundle/lib/* > bundle/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-v5-llvm17-host-tools-linux-x86_64
          path: bundle
          retention-days: 7
