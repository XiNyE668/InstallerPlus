name: Android 16 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build installable debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug assembleRelease
          echo "Generated APKs:"
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: installX-Hub-A16-debug-installable
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: installX-Hub-A16-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload apksigner tool for offline fixed-key signing
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
