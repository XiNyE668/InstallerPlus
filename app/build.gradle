plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'ltd.nextalone.pkginstallerplus'
    compileSdk 36

    defaultConfig {
        applicationId "ltd.nextalone.pkginstallerplus"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode(getTimeStamp.call() as int)
        versionName "2.0-A16" + (getGitHeadRefsSuffix.call() as String)
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Keep the historical fixed resource package id for legacy N/Q resource injection.
    aaptOptions {
        additionalParameters '--allow-reserved-package-id', '--package-id', '0x75'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
